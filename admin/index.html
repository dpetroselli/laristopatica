<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — La Ristopatica</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf3eb; --panel: #fffdf9; --ink: #241e18; --ink-soft: #5c534a;
  --brand: #c2372c; --brand-dark: #9c2a21; --line: #e8ddd0; --ok: #3d7a44;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191512; --panel: #221d19; --ink: #f0e8de; --ink-soft: #b3a89c;
    --brand: #e05a4e; --brand-dark: #ef7c72; --line: #38302a; --ok: #7dc287;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Work Sans", system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; }
h1, h2, h3 { font-family: "Fraunces", Georgia, serif; }
button { font-family: inherit; cursor: pointer; }

.layout { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }

/* ------------------------------------------------------------ sidebar */
.sidebar { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 14px 40px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand img { width: 44px; height: 44px; border-radius: 50%; }
.brand strong { font-family: "Fraunces", serif; font-size: 1.05rem; }
.brand small { display: block; color: var(--ink-soft); font-size: 0.75rem; }
.side-group { margin-top: 14px; }
.side-group > h3 {
  font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink-soft); padding: 6px 8px;
  display: flex; justify-content: space-between; align-items: center;
}
.side-group .add {
  border: 1px solid var(--line); background: none; color: var(--brand);
  border-radius: 6px; font-size: 0.85rem; padding: 1px 8px; font-weight: 600;
}
.side-item {
  display: block; width: 100%; text-align: left; background: none; border: none;
  padding: 8px 10px; border-radius: 8px; color: var(--ink); font-size: 0.92rem;
}
.side-item:hover { background: var(--bg); }
.side-item.active { background: var(--brand); color: #fff; }
.side-user { margin-top: 22px; padding: 8px 10px; font-size: 0.8rem; color: var(--ink-soft); border-top: 1px solid var(--line); }
.side-user button { background: none; border: none; color: var(--brand); font-size: 0.8rem; padding: 0; }

/* --------------------------------------------------------------- main */
.main { padding: 0 0 80px; }
.topbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px;
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); padding: 12px 28px;
}
.topbar h1 { font-size: 1.15rem; flex: 1; }
.status { font-size: 0.85rem; color: var(--ink-soft); }
.status.ok { color: var(--ok); font-weight: 600; }
.status.err { color: var(--brand); font-weight: 600; }
.status a { color: inherit; }
.btn {
  border: none; border-radius: 999px; padding: 9px 20px; font-weight: 600; font-size: 0.92rem;
  background: var(--brand); color: #fff;
}
.btn:hover { background: var(--brand-dark); }
.btn.ghost { background: none; color: var(--ink); border: 1.5px solid var(--line); text-decoration: none; }
.btn.danger { background: none; color: var(--brand); border: 1.5px solid var(--brand); }

.editor { max-width: 860px; padding: 26px 28px; display: grid; gap: 18px; }
.field label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.88rem; }
.field .hint { font-weight: 400; color: var(--ink-soft); font-size: 0.8rem; margin-left: 6px; }
input[type="text"], input[type="password"], textarea, select {
  width: 100%; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 9px;
  background: var(--panel); color: var(--ink); font-family: inherit; font-size: 0.95rem;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--brand); }
textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 14px; }

.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
  display: grid; gap: 12px;
}
.card-head { display: flex; align-items: center; gap: 8px; }
.card-head input { font-weight: 600; }
.icon-btn {
  border: 1px solid var(--line); background: none; color: var(--ink-soft);
  border-radius: 7px; width: 30px; height: 30px; font-size: 0.9rem; flex: none;
}
.icon-btn:hover { color: var(--brand); border-color: var(--brand); }

.item-row { display: grid; grid-template-columns: 1.2fr 0.8fr 2fr auto auto auto; gap: 8px; align-items: center; }
.item-row input { padding: 7px 10px; font-size: 0.9rem; }
.items-head { display: grid; grid-template-columns: 1.2fr 0.8fr 2fr auto; gap: 8px; font-size: 0.75rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; }
.add-inline { border: 1.5px dashed var(--line); background: none; color: var(--ink-soft); border-radius: 9px; padding: 9px; font-size: 0.9rem; width: 100%; }
.add-inline:hover { color: var(--brand); border-color: var(--brand); }
.check { display: flex; gap: 8px; align-items: center; font-size: 0.88rem; color: var(--ink-soft); }
.section-sep { border: none; border-top: 1px solid var(--line); margin: 6px 0; }
.muted { color: var(--ink-soft); font-size: 0.85rem; }
.editor-actions { display: flex; gap: 10px; }

/* --------------------------------------------------------------- login */
.login {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
  background: var(--bg); padding: 20px;
}
/* su Safari display:flex vince sull'attributo hidden: forziamo la chiusura */
.login[hidden] { display: none !important; }
.login-box {
  max-width: 460px; width: 100%; background: var(--panel); border: 1px solid var(--line);
  border-radius: 18px; padding: 34px; display: grid; gap: 14px; text-align: center;
}
.login-box img { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto; }
.login-box h1 { font-size: 1.4rem; }
.login-box p { color: var(--ink-soft); font-size: 0.92rem; text-align: left; }
.login-box .status { min-height: 1.2em; }

@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--line); }
  .row, .row-3, .item-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <div class="login-box">
    <img src="../assets/img/logo.png" alt="">
    <h1>Admin La Ristopatica</h1>
    <p id="login-text">Ciao! Inserisci la password per entrare (la ricordo su questo dispositivo).</p>
    <input type="password" id="token-input" placeholder="Password">
    <button class="btn" id="token-save">Entra</button>
    <span class="status" id="login-status"></span>
    <span class="muted" style="font-size:0.7rem">versione admin 7</span>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <h1 id="view-title">Admin</h1>
      <span class="status" id="status"></span>
      <a class="btn ghost" id="preview-link" href="#" target="_blank">Anteprima sito ↗</a>
      <button class="btn" id="save">💾 Salva e pubblica</button>
    </div>
    <div class="editor" id="editor"></div>
  </div>
</div>

<script>
"use strict";
// ---------------------------------------------------------------- config
const REPO = "dpetroselli/laristopatica";
const BRANCH = "main";
const SITE_URL = "https://dpetroselli.github.io/laristopatica/";
// Modalità: "local" quando gira col server admin.js (porta 8735), "github" quando è online.
const LOCAL = location.port === "8735";
const PREVIEW = LOCAL ? "/site/" : SITE_URL;

let content = null;
let fileSha = null; // sha di content.json su GitHub (per la modalità online)
let view = { type: "guide", group: "quartieri", index: 0 };
let dirty = false;

const GROUPS = [
  ["quartieri", "🍝 Quartieri di Roma"],
  ["guideFood", "🥐 Guide food"],
  ["viaggi", "✈️ Mini guide di viaggio"],
];
const COLORS = ["terracotta", "oliva", "rosa", "blu", "senape", "azzurro"];

const $ = (sel) => document.querySelector(sel);
const el = (tag, attrs = {}, ...children) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "value") n.value = v;
    else if (k === "checked") n.checked = v;
    else n.setAttribute(k, v);
  }
  for (const c of children) if (c != null) n.append(c);
  return n;
};

// ------------------------------------------------------- GitHub backend
const tokenKey = "ristopatica-admin-token";
const getToken = () => localStorage.getItem(tokenKey) || "";
const ghHeaders = () => ({
  Authorization: "Bearer " + getToken(),
  Accept: "application/vnd.github+json",
  "X-GitHub-Api-Version": "2022-11-28",
});

const b64encodeUtf8 = (s) => {
  const bytes = new TextEncoder().encode(s);
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
};
const b64decodeUtf8 = (b64) => {
  const bin = atob(b64.replace(/\n/g, ""));
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
};

// fetch con timeout: se la rete non risponde entro 20s, errore chiaro invece di attesa infinita
async function fetchT(url, opts = {}) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 20000);
  try {
    return await fetch(url, { ...opts, signal: ctrl.signal });
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "GitHub non risponde (rete lenta o bloccata?)" : "connessione a GitHub fallita: " + e.message);
  } finally {
    clearTimeout(t);
  }
}

async function ghGetFile() {
  const r = await fetchT(`https://api.github.com/repos/${REPO}/contents/content.json?ref=${BRANCH}`, {
    headers: getToken() ? ghHeaders() : { Accept: "application/vnd.github+json" },
    cache: "no-store",
  });
  if (!r.ok) throw new Error(r.status === 401 ? "chiave non valida" : `GitHub ha risposto ${r.status}`);
  const data = await r.json();
  return { json: JSON.parse(b64decodeUtf8(data.content)), sha: data.sha };
}

async function ghPutFile(json) {
  // se qualcun altro ha salvato nel frattempo, avvisa prima di sovrascrivere
  const latest = await ghGetFile();
  if (latest.sha !== fileSha) {
    if (!confirm("Attenzione: i contenuti sul sito sono stati modificati da qualcun altro dopo che hai aperto l'admin. Vuoi sovrascriverli con la tua versione?")) {
      throw new Error("salvataggio annullato — ricarica la pagina per ripartire dai contenuti aggiornati");
    }
    fileSha = latest.sha;
  }
  const r = await fetchT(`https://api.github.com/repos/${REPO}/contents/content.json`, {
    method: "PUT",
    headers: ghHeaders(),
    body: JSON.stringify({
      message: "Aggiornamento contenuti dall'admin",
      content: b64encodeUtf8(JSON.stringify(json, null, 2)),
      sha: fileSha,
      branch: BRANCH,
    }),
  });
  if (r.status === 401 || r.status === 403) throw new Error("chiave non valida o senza permessi di scrittura");
  if (r.status === 409) throw new Error("conflitto di versione — ricarica la pagina e riprova");
  if (!r.ok) throw new Error(`GitHub ha risposto ${r.status}`);
  const out = await r.json();
  fileSha = out.content.sha;
}

async function ghWhoAmI() {
  const r = await fetchT("https://api.github.com/user", { headers: ghHeaders() }).catch(() => null);
  if (!r) return null;
  if (!r.ok) return null;
  return (await r.json()).login;
}

// ------------------------------------------------- load/save (adapter)
async function loadContent() {
  if (LOCAL) {
    content = await (await fetch("/api/content")).json();
  } else {
    const f = await ghGetFile();
    content = f.json;
    fileSha = f.sha;
  }
}

// Controlli minimi prima di salvare (gli stessi del server locale).
function validate(c) {
  const slugs = new Set();
  for (const [group] of GROUPS) {
    for (const g of c[group]) {
      if (!g.title || !g.title.trim()) return "ogni guida deve avere un titolo";
      if (!g.slug || !/^[a-z0-9-]+$/.test(g.slug)) return `indirizzo pagina (slug) non valido per “${g.title}”`;
      if (["index", "quartieri", "viaggi", "assets", "sw", "manifest", "admin"].includes(g.slug))
        return `lo slug “${g.slug}” è riservato`;
      if (slugs.has(g.slug)) return `due guide hanno lo stesso slug: “${g.slug}”`;
      slugs.add(g.slug);
    }
  }
  return null;
}

async function saveContent() {
  const err = validate(content);
  if (err) throw new Error(err);
  if (LOCAL) {
    const r = await fetch("/api/content", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(content) });
    const out = await r.json();
    if (!out.ok) throw new Error(out.error);
  } else {
    await ghPutFile(content);
  }
}

// ------------------------------------------------------------- sidebar
function setDirty(d) {
  dirty = d;
  $("#status").textContent = d ? "Modifiche non salvate" : "";
  $("#status").className = "status";
}

function slugify(s) {
  return s.toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "guida";
}

function renderSidebar() {
  const sb = $("#sidebar");
  sb.replaceChildren(
    el("div", { class: "brand" },
      el("img", { src: "../assets/img/logo.png", alt: "" }),
      el("div", {}, el("strong", {}, "La Ristopatica"), el("small", {}, "pannello contenuti"))
    ),
    sideBtn("⚙️ Sito e Instagram", view.type === "site", () => select({ type: "site" })),
    sideBtn("👩‍🍳 Chi sono", view.type === "about", () => select({ type: "about" })),
    ...GROUPS.map(([key, label]) =>
      el("div", { class: "side-group" },
        el("h3", {}, label, el("button", { class: "add", title: "Aggiungi guida", onclick: () => addGuide(key) }, "+ nuova")),
        ...content[key].map((g, i) =>
          sideBtn(`${g.emoji || "📄"} ${g.title}`, view.type === "guide" && view.group === key && view.index === i,
            () => select({ type: "guide", group: key, index: i }))
        )
      )
    ),
    LOCAL ? null : el("div", { class: "side-user", id: "side-user" })
  );
  if (!LOCAL) refreshUser();
}
async function refreshUser() {
  const box = $("#side-user");
  if (!box) return;
  const who = await ghWhoAmI();
  box.replaceChildren(
    el("span", {}, who ? `Connessa come ${who} · ` : "Chiave non verificata · "),
    el("button", { onclick: () => { localStorage.removeItem(tokenKey); location.reload(); } }, "esci")
  );
}
function sideBtn(label, active, onclick) {
  return el("button", { class: "side-item" + (active ? " active" : ""), onclick }, label);
}

function select(v) { view = v; renderSidebar(); renderEditor(); }

function addGuide(group) {
  content[group].push({
    slug: "", title: "Nuova guida", emoji: "📍", color: COLORS[content[group].length % COLORS.length],
    teaser: "", intro: [""], sections: [{ title: "🍴 Dove mangiare", items: [{ name: "" }] }],
    _new: true,
  });
  setDirty(true);
  select({ type: "guide", group, index: content[group].length - 1 });
}

// ------------------------------------------------------------- editors
function field(labelText, input, hint) {
  const lab = el("label", {}, labelText);
  if (hint) lab.append(el("span", { class: "hint" }, hint));
  return el("div", { class: "field" }, lab, input);
}
const textInput = (obj, key, extra = {}) =>
  el("input", { type: "text", value: obj[key] || "", oninput: (e) => { obj[key] = e.target.value; setDirty(true); extra.oninput && extra.oninput(e); } });
const areaInput = (obj, key, rows) =>
  el("textarea", { rows: rows || 4, value: obj[key] || "", oninput: (e) => { obj[key] = e.target.value; setDirty(true); } });

const parasToText = (arr) => (arr || []).join("\n\n");
const textToParas = (t) => t.split(/\n\s*\n/).map((s) => s.trim().replace(/\s*\n\s*/g, " ")).filter(Boolean);
function parasArea(obj, key, rows) {
  return el("textarea", { rows: rows || 8, value: parasToText(obj[key]), oninput: (e) => { obj[key] = textToParas(e.target.value); setDirty(true); } });
}

function renderEditor() {
  const ed = $("#editor");
  if (view.type === "site") {
    $("#view-title").textContent = "⚙️ Sito e Instagram";
    ed.replaceChildren(
      field("Nome del sito", textInput(content.site, "name")),
      field("Slogan", textInput(content.site, "tagline"), "compare sotto il titolo in home"),
      field("Descrizione", areaInput(content.site, "description", 3), "usata da Google e dai social"),
      el("div", { class: "row" },
        field("Link Instagram", textInput(content.site, "instagram")),
        field("Nome utente Instagram", textInput(content.site, "instagramHandle"))
      ),
      field("Dominio del sito", textInput(content.site, "domain"), "serve per SEO e sitemap — non toccare se non cambia")
    );
    return;
  }
  if (view.type === "about") {
    $("#view-title").textContent = "👩‍🍳 Chi sono";
    ed.replaceChildren(
      field("Titolo", textInput(content.about, "title")),
      field("Testo", parasArea(content.about, "paragraphs", 16), "un paragrafo per blocco, separati da una riga vuota")
    );
    return;
  }

  const g = content[view.group][view.index];
  $("#view-title").textContent = `${g.emoji || ""} ${g.title}`;

  const slugField = el("input", {
    type: "text", value: g.slug,
    ...(g._new ? {} : { disabled: "" }),
    oninput: (e) => { g.slug = e.target.value; g._slugTouched = true; setDirty(true); },
  });

  const titleInput = textInput(g, "title", {
    oninput: () => {
      if (g._new && !g._slugTouched) { g.slug = slugify(g.title); slugField.value = g.slug; }
      $("#view-title").textContent = `${g.emoji || ""} ${g.title}`;
      renderSidebar();
    },
  });

  const colorSel = el("select", { onchange: (e) => { g.color = e.target.value; setDirty(true); } },
    ...COLORS.map((c) => el("option", { value: c, ...(g.color === c ? { selected: "" } : {}) }, c)));

  ed.replaceChildren(
    el("div", { class: "row-3" },
      field("Titolo", titleInput),
      field("Emoji", textInput(g, "emoji", { oninput: () => { $("#view-title").textContent = `${g.emoji || ""} ${g.title}`; renderSidebar(); } })),
      field("Colore card", colorSel)
    ),
    el("div", { class: "row" },
      field("Frase breve (teaser)", textInput(g, "teaser"), "compare sulla card e sotto il titolo"),
      field("Indirizzo pagina (slug)", slugField, g._new ? "generato dal titolo, puoi cambiarlo" : "bloccato per non rompere i link")
    ),
    field("Introduzione", parasArea(g, "intro", 8), "un paragrafo per blocco, separati da una riga vuota"),
    el("h2", {}, "Sezioni"),
    el("p", { class: "muted" }, "Ogni sezione ha un titolo (es. “🍕 Pizza & Street Food”), un testo opzionale e un elenco di posti. Luogo e nota sono facoltativi."),
    ...g.sections.map((s, si) => sectionCard(g, s, si)),
    el("button", { class: "add-inline", onclick: () => { g.sections.push({ title: "✨ Nuova sezione", items: [{ name: "" }] }); setDirty(true); renderEditor(); } }, "+ Aggiungi sezione"),
    el("hr", { class: "section-sep" }),
    el("div", { class: "editor-actions" },
      el("a", { class: "btn ghost", href: `${PREVIEW}${g.slug}.html`, target: "_blank" }, "Apri questa pagina ↗"),
      el("button", {
        class: "btn danger",
        onclick: () => {
          if (!confirm(`Eliminare la guida “${g.title}”? (Puoi ancora annullare non salvando)`)) return;
          content[view.group].splice(view.index, 1);
          setDirty(true);
          select(content[view.group].length ? { type: "guide", group: view.group, index: 0 } : { type: "site" });
        },
      }, "🗑 Elimina guida")
    )
  );
}

function sectionCard(g, s, si) {
  const move = (dir) => {
    const to = si + dir;
    if (to < 0 || to >= g.sections.length) return;
    [g.sections[si], g.sections[to]] = [g.sections[to], g.sections[si]];
    setDirty(true); renderEditor();
  };
  const items = s.items || (s.items = []);
  return el("div", { class: "card" },
    el("div", { class: "card-head" },
      textInput(s, "title"),
      el("button", { class: "icon-btn", title: "Sposta su", onclick: () => move(-1) }, "↑"),
      el("button", { class: "icon-btn", title: "Sposta giù", onclick: () => move(1) }, "↓"),
      el("button", { class: "icon-btn", title: "Elimina sezione", onclick: () => { if (confirm("Eliminare questa sezione?")) { g.sections.splice(si, 1); setDirty(true); renderEditor(); } } }, "🗑")
    ),
    field("Testo della sezione (opzionale)", parasArea(s, "paras", 3)),
    items.length ? el("div", { class: "items-head" }, el("span", {}, "Nome"), el("span", {}, "Luogo"), el("span", {}, "Nota / descrizione"), el("span")) : null,
    ...items.map((it, ii) => itemRow(g, s, it, ii)),
    el("button", { class: "add-inline", onclick: () => { items.push({ name: "" }); setDirty(true); renderEditor(); } }, "+ Aggiungi posto"),
    el("label", { class: "check" },
      el("input", { type: "checkbox", ...(s.grid ? { checked: true } : {}), onchange: (e) => { if (e.target.checked) s.grid = true; else delete s.grid; setDirty(true); } }),
      "Mostra come griglia compatta (solo nomi, per elenchi lunghi)"
    )
  );
}

function itemRow(g, s, it, ii) {
  const move = (dir) => {
    const to = ii + dir;
    if (to < 0 || to >= s.items.length) return;
    [s.items[ii], s.items[to]] = [s.items[to], s.items[ii]];
    setDirty(true); renderEditor();
  };
  return el("div", { class: "item-row" },
    textInput(it, "name"),
    textInput(it, "place"),
    textInput(it, "desc"),
    el("button", { class: "icon-btn", title: "Su", onclick: () => move(-1) }, "↑"),
    el("button", { class: "icon-btn", title: "Giù", onclick: () => move(1) }, "↓"),
    el("button", { class: "icon-btn", title: "Elimina", onclick: () => { s.items.splice(ii, 1); setDirty(true); renderEditor(); } }, "🗑")
  );
}

// ---------------------------------------------------------------- save
async function save() {
  const status = $("#status");
  // pulizia campi interni e voci vuote
  for (const [key] of GROUPS)
    for (const g of content[key]) {
      if (g._new && !g.slug) g.slug = slugify(g.title);
      delete g._new; delete g._slugTouched;
      for (const s of g.sections) {
        if (s.items) s.items = s.items.filter((it) => (it.name || "").trim());
        for (const it of s.items || []) { if (!it.place) delete it.place; if (!it.desc) delete it.desc; }
        if (s.paras && !s.paras.length) delete s.paras;
      }
    }
  status.textContent = LOCAL ? "Salvataggio e rigenerazione…" : "Salvataggio su GitHub…";
  status.className = "status";
  try {
    await saveContent();
    setDirty(false);
    status.replaceChildren();
    if (LOCAL) {
      status.append("✔ Salvato: il sito è aggiornato");
    } else {
      status.append("✔ Salvato! Il sito si aggiorna da solo in 1-2 minuti (",
        el("a", { href: `https://github.com/${REPO}/actions`, target: "_blank" }, "stato"), ")");
    }
    status.className = "status ok";
    renderSidebar(); renderEditor();
  } catch (e) {
    status.textContent = "Errore: " + e.message;
    status.className = "status err";
  }
}

// ---------------------------------------------------------------- avvio
async function start() {
  $("#preview-link").href = PREVIEW;
  if (!LOCAL && !getToken()) {
    await loadSecret();
    $("#login").hidden = false;
    return;
  }
  try {
    await loadContent();
  } catch (e) {
    if (!LOCAL) {
      // chiave scaduta o revocata: torna al login
      localStorage.removeItem(tokenKey);
      await loadSecret();
      $("#login").hidden = false;
      $("#login-status").textContent = "Accesso scaduto o non valido: entra di nuovo.";
      $("#login-status").className = "status err";
      return;
    }
    $("#status").textContent = "Errore nel caricare i contenuti: " + e.message;
    $("#status").className = "status err";
    return;
  }
  $("#login").hidden = true;
  renderSidebar(); renderEditor();
}

// Se esiste admin/segreto.json l'accesso è con password (il token GitHub è lì
// dentro, cifrato); altrimenti si incolla direttamente il token.
let secretBlob = window.SEGRETO || null; // incorporato nella pagina dalla build
async function loadSecret() {
  if (secretBlob) return;
  // ripiego: prova a scaricarlo (con cache-buster: la CDN può ricordare un vecchio 404)
  try {
    const r = await fetch("segreto.json?nc=" + Date.now(), { cache: "no-store" });
    if (r.ok) secretBlob = await r.json();
  } catch {}
  if (!secretBlob) {
    $("#login-text").innerHTML = "Ciao! Per salvare le modifiche serve la <strong>chiave di accesso GitHub</strong> (te la fornisce chi gestisce il sito — incollala qui una volta sola).";
    $("#token-input").placeholder = "Incolla qui la chiave (github_pat_… o ghp_…)";
  }
}

const b64ToBytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
async function decryptToken(password) {
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64ToBytes(secretBlob.salt), iterations: secretBlob.iter, hash: "SHA-256" },
    material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(secretBlob.iv) }, key, b64ToBytes(secretBlob.data));
  return new TextDecoder().decode(plain);
}

$("#token-save").addEventListener("click", async () => {
  const input = $("#token-input").value.trim();
  const ls = $("#login-status");
  if (!input) { ls.textContent = "Scrivi la password nel campo qui sopra."; ls.className = "status err"; return; }
  if (!secretBlob && !/^(github_pat_|ghp_)/.test(input)) {
    // in modalità token qualcuno sta scrivendo una password: probabile segreto.json non caricato
    ls.textContent = "Non riesco a caricare la configurazione della password: ricarica la pagina tra un minuto e riprova.";
    ls.className = "status err";
    loadSecret();
    return;
  }
  ls.textContent = "Sblocco in corso…"; ls.className = "status";
  let token = input;
  if (secretBlob) {
    try {
      token = await decryptToken(input);
    } catch {
      ls.textContent = "Password sbagliata. Riprova.";
      ls.className = "status err";
      return;
    }
  }
  localStorage.setItem(tokenKey, token);
  ls.textContent = "Password ok, mi collego a GitHub…";
  try {
    await loadContent();
    $("#login").hidden = true;
    renderSidebar(); renderEditor();
  } catch (e) {
    localStorage.removeItem(tokenKey);
    ls.textContent = secretBlob
      ? `Password giusta, ma l'accesso a GitHub non riesce: ${e.message}`
      : `Accesso non riuscito: ${e.message}`;
    ls.className = "status err";
  }
});
$("#token-input").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#token-save").click(); });

$("#save").addEventListener("click", save);
window.addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });
window.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(); } });

start();
</script>
</body>
